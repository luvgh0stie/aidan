<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ♡</title>
<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #fff8ef;
    color: #5c4033;
    font-family: Arial, sans-serif;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
}
.card {
    transition: opacity 0.4s ease, transform 0.4s ease;
    padding: 40px 25px;
}
img {
    width: 300px;
    max-width: 80vw;
}
h1 {
    font-size: 48px;
    margin: 20px 0 10px;
}
p {
    font-size: 20px;
}
.letter {
  background: #f7f0e5;
  padding: 18px;
  border-radius: 6px;
  box-shadow: 0 12px 25px rgba(60, 40, 25, 0.25);
  transform: rotate(-1deg);
  max-width: 550px;
  margin: auto;
}

.letter-paper {
  position: relative;
  background:
    repeating-linear-gradient(
      to bottom,
      #fffdf7 0px,
      #fffdf7 31px,
      #d9d0c5 32px
    );
  min-height: 430px;
  max-height: 500px;
overflow-y: auto;
  padding: 35px 35px 35px 55px;
  box-sizing: border-box;
  text-align: left;
  line-height: 32px;
  font-family: "Segoe Print", "Comic Sans MS", cursive;
  color: #5b4030;
  border-radius: 2px;
}
.letter-paper::-webkit-scrollbar {
  width: 8px;
}

.letter-paper::-webkit-scrollbar-thumb {
  background: #d8bfa8;
  border-radius: 10px;
}

.letter-paper::before {
  content: "";
  position: absolute;
  left: 35px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #e7aaaa;
}
.letter-paper::after {
  content: "♡";
  position: absolute;
  right: 18px;
  top: 12px;
  font-size: 28px;
  color: #c9797f;
  transform: rotate(12deg);
}

.letter h1 {
  color: #6b4936;
  font-family: "Comic Sans MS", cursive;
  margin-bottom: 20px;
}

.letter-heart {
  font-size: 30px;
  color: #b96b72;
  margin: 5px;
}
button {
    background: #c9797f;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 14px 28px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

    <p>I made a little something for you...</p>
    <button onclick="nextPage()">Open please ♡</button>
</div>
<script>
function nextPage() {
  const card = document.querySelector(".card");

  card.style.opacity = "0";
  card.style.transform = "translateY(10px)";

  setTimeout(() => {
    card.innerHTML = `
      <h1>There’s something I’ve been wanting to ask you... ♡</h1>
      <p>I know the distance isn't always easy, but you mean so much to me.</p>
      <button onclick="nextQuestion()">Keep going ♡</button>
    `;

    card.style.opacity = "1";
    card.style.transform = "translateY(0)";
  }, 400);
}

function nextQuestion() {
  document.body.style.overflow = "hidden";

  document.querySelector(".card").innerHTML = `
    <h1>Will you be my boyfriend? ♡</h1>
    <button onclick="sayYes()">YES ♡</button>
    <button id="noButton" onmouseover="moveNoButton()">NO</button>
  `;
}

function moveNoButton() {
  const button = document.getElementById("noButton");

  let scale = parseFloat(button.dataset.scale || "1");

  scale -= 0.1;

  if (scale <= 0.2) {
    button.style.display = "none";
    return;
  }

  button.dataset.scale = scale;

  button.style.position = "fixed";

  const x = window.innerWidth / 2 + (Math.random() * 300 - 150);
  const y = window.innerHeight / 2 + (Math.random() * 200 - 100);

  button.style.left = x + "px";
  button.style.top = y + "px";
  button.style.transform = `translate(-50%, -50%) scale(${scale})`;
}

function sayYes() {
  document.querySelector(".card").innerHTML = `
    <h1> YAYYY You're officially my boyfriend! 🤎</h1>
    <p>I’m so happy I get to call you mine sorry no take backs</p>
    <button onclick="showLetter()">open please ♡</button>
  `;
}

function showLetter() {
  document.querySelector(".card").innerHTML = `
    <div class="letter">
      <div class="letter-heart">♡</div>

      <h1>For you, my love ♡</h1>

      <div class="letter-paper">
        <p>
          <strong>Dear Aidan,</strong><br>
I love you infinity, like sooo much. You mean so much to me, and somehow, you became one of my favorite people in such a short amount of time. I honestly don't know how you became such an important part of my life so quickly, but I'm so grateful that you did. You make me feel so loved, cared for, and understood. Even with the distance between us, you always find ways to make me feel close to you. I love talking to you, hearing about your day, and just having you in my life. i know I want to spend the rest of my life with you. I want to get married, have kids, travel the world together, and make so many memories with you. I want the big moments, but I also want all the little everyday moments with you too. Last night when you said “can we talk,” I got sooo scared because I thought you wanted to end things. But I'm actually so happy we had that conversation because it made me realize even more how much I want you and how much I want this to work out. I don't want to lose what we have. i know the distance won't always be easy, but I wouldn't trade what we have for anything. I want you to know that I'm serious about you and about us. I don't want something temporary with you. I want to keep choosing you and choosing us. i don't know exactly what our future is going to look like, but I know who I want beside me I want it to be you. im so happy you said yes even though you asked me last night Also, just so we're clear... you're stuck with me now. No take-backs or ill drop kick you and throw a cold burrito at you. 🤎<br>
          <strong>I love you infinity,</strong>
        </p>
      </div>

      <div class="letter-heart">♡</div>
    </div>
  `;
}
</script>
